name: Deploy

#   build           — compile/typecheck shared + API + web (all triggers)
#   resolve-target  — map branch / dispatch input → SAM env + stack (no AWS)
#   deploy-api      — SAM (Lambda / API Gateway) for the resolved stack only
#   deploy-web      — Next.js production build using that stack's outputs
#                     Amplify's GitHub connection publishes the live site
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target SAM environment (dev only from the dev branch; prod only from main)
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || vars.REGION || secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION || secrets.REGION }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build -w @spicycorner/shared
      - run: npm run typecheck

  resolve-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      config_env: ${{ steps.resolve.outputs.config_env }}
      stack_name: ${{ steps.resolve.outputs.stack_name }}
      environment: ${{ steps.resolve.outputs.environment }}
      agmarknet_secret_name: ${{ steps.resolve.outputs.agmarknet_secret_name }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail

          should_deploy="false"
          config_env=""
          stack_name=""
          environment=""
          agmarknet_secret_name=""

          apply_dev() {
            should_deploy="true"
            config_env="default"
            stack_name="spicycorner-dev"
            environment="dev"
            agmarknet_secret_name="agmarknet/api-key-dev"
          }

          apply_prod() {
            should_deploy="true"
            config_env="prod"
            stack_name="spicycorner-prod"
            environment="prod"
            agmarknet_secret_name="agmarknet/api-key-prod"
          }

          if [ "${EVENT_NAME}" = "push" ]; then
            case "${REF_NAME}" in
              main)
                apply_prod
                ;;
              dev)
                apply_dev
                ;;
              *)
                should_deploy="false"
                echo "Push to ${REF_NAME}: validation only — no AWS deploy."
                ;;
            esac
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            target="${INPUT_ENVIRONMENT:-dev}"
            case "${target}" in
              prod)
                if [ "${REF_NAME}" != "main" ]; then
                  echo "::error::Production deploy refused: workflow_dispatch environment=prod is allowed only from main (current branch: ${REF_NAME})."
                  exit 1
                fi
                apply_prod
                ;;
              dev)
                if [ "${REF_NAME}" != "dev" ]; then
                  echo "::error::Development deploy refused: workflow_dispatch environment=dev is allowed only from the dev branch (current branch: ${REF_NAME})."
                  exit 1
                fi
                apply_dev
                ;;
              *)
                echo "::error::Unknown environment '${target}'. Use dev or prod."
                exit 1
                ;;
            esac
          else
            echo "::error::Unsupported event ${EVENT_NAME}."
            exit 1
          fi

          if [ "${environment}" = "prod" ] && [ "${REF_NAME}" != "main" ]; then
            echo "::error::Production deploy refused from branch ${REF_NAME}."
            exit 1
          fi

          if [ "${environment}" = "dev" ] && [ "${REF_NAME}" != "dev" ]; then
            echo "::error::Development deploy refused from branch ${REF_NAME}."
            exit 1
          fi

          if [ "${should_deploy}" = "true" ]; then
            if [ "${environment}" = "prod" ]; then
              if [ "${config_env}" != "prod" ] || [ "${stack_name}" != "spicycorner-prod" ]; then
                echo "::error::Prod mapping mismatch (config_env=${config_env} stack=${stack_name})."
                exit 1
              fi
            elif [ "${environment}" = "dev" ]; then
              if [ "${config_env}" != "default" ] || [ "${stack_name}" != "spicycorner-dev" ]; then
                echo "::error::Dev mapping mismatch (config_env=${config_env} stack=${stack_name})."
                exit 1
              fi
            else
              echo "::error::Refusing deploy with unknown environment '${environment}'."
              exit 1
            fi
            expected_secret="agmarknet/api-key-${environment}"
            if [ "${agmarknet_secret_name}" != "${expected_secret}" ] || [ "${agmarknet_secret_name}" = "agmarknet/api-key" ]; then
              echo "::error::Agmarknet secret mapping mismatch (name=${agmarknet_secret_name})."
              exit 1
            fi
          fi

          {
            echo "should_deploy=${should_deploy}"
            echo "config_env=${config_env}"
            echo "stack_name=${stack_name}"
            echo "environment=${environment}"
            echo "agmarknet_secret_name=${agmarknet_secret_name}"
          } >> "${GITHUB_OUTPUT}"

          echo "should_deploy=${should_deploy} config_env=${config_env} stack=${stack_name} Environment=${environment} agmarknet_secret_name=${agmarknet_secret_name} ref=${REF_NAME} event=${EVENT_NAME}"

          {
            echo "## Deploy target"
            echo ""
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Branch: \`${REF_NAME}\`"
            echo "- Deploy: \`${should_deploy}\`"
            echo "- SAM config: \`${config_env:-none}\`"
            echo "- Stack: \`${stack_name:-none}\`"
            echo "- Environment: \`${environment:-none}\`"
            echo "- Agmarknet secret name: \`${agmarknet_secret_name:-none}\`"
            echo ""
            echo "Legacy secret \`agmarknet/api-key\` is never written by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build, resolve-target]
    if: |
      needs.resolve-target.outputs.should_deploy == 'true' &&
      (
        (needs.resolve-target.outputs.environment == 'prod' && github.ref_name == 'main') ||
        (needs.resolve-target.outputs.environment == 'dev' && github.ref_name == 'dev')
      )
    env:
      CONFIG_ENV: ${{ needs.resolve-target.outputs.config_env }}
      STACK_NAME: ${{ needs.resolve-target.outputs.stack_name }}
      SAM_ENVIRONMENT: ${{ needs.resolve-target.outputs.environment }}
      AGMARKNET_SECRET_NAME: ${{ needs.resolve-target.outputs.agmarknet_secret_name }}
    steps:
      - name: Guard SAM target
        run: |
          set -euo pipefail
          echo "Resolved target config_env=${CONFIG_ENV} stack=${STACK_NAME} Environment=${SAM_ENVIRONMENT} agmarknet_secret_name=${AGMARKNET_SECRET_NAME} ref=${GITHUB_REF_NAME}"
          if [ -z "${CONFIG_ENV}" ] || [ -z "${STACK_NAME}" ] || [ -z "${SAM_ENVIRONMENT}" ] || [ -z "${AGMARKNET_SECRET_NAME}" ]; then
            echo "::error::Missing resolved SAM target."
            exit 1
          fi
          if [ "${AGMARKNET_SECRET_NAME}" != "agmarknet/api-key-${SAM_ENVIRONMENT}" ] || [ "${AGMARKNET_SECRET_NAME}" = "agmarknet/api-key" ]; then
            echo "::error::Refusing unexpected Agmarknet secret name '${AGMARKNET_SECRET_NAME}'."
            exit 1
          fi
          if [ "${SAM_ENVIRONMENT}" = "prod" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Production deploy refused from branch ${GITHUB_REF_NAME}."
              exit 1
            fi
            if [ "${CONFIG_ENV}" != "prod" ] || [ "${STACK_NAME}" != "spicycorner-prod" ] || [ "${AGMARKNET_SECRET_NAME}" != "agmarknet/api-key-prod" ]; then
              echo "::error::Production path must use --config-env prod, stack spicycorner-prod, and secret agmarknet/api-key-prod."
              exit 1
            fi
          elif [ "${SAM_ENVIRONMENT}" = "dev" ]; then
            if [ "${GITHUB_REF_NAME}" != "dev" ]; then
              echo "::error::Development deploy refused from branch ${GITHUB_REF_NAME}."
              exit 1
            fi
            if [ "${CONFIG_ENV}" != "default" ] || [ "${STACK_NAME}" != "spicycorner-dev" ] || [ "${AGMARKNET_SECRET_NAME}" != "agmarknet/api-key-dev" ]; then
              echo "::error::Development path must use --config-env default, stack spicycorner-dev, and secret agmarknet/api-key-dev."
              exit 1
            fi
          else
            echo "::error::Unsupported SAM environment '${SAM_ENVIRONMENT}'."
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build -w @spicycorner/shared

      - name: Require AWS_REGION from GitHub
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::Set AWS_REGION in GitHub → Settings → Secrets and variables → Actions (Variables or Secrets). Do not rely on a hardcoded region in the repo."
            exit 1
          fi
          echo "AWS_REGION=${AWS_REGION}"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Writes only agmarknet/api-key-${Environment}. Never create, update, or
      # delete the legacy shared name agmarknet/api-key.
      - name: Upsert env-specific Agmarknet API key into Secrets Manager
        env:
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY }}
        run: |
          set -euo pipefail
          NAME="${AGMARKNET_SECRET_NAME}"
          if [ "${NAME}" != "agmarknet/api-key-${SAM_ENVIRONMENT}" ] || [ "${NAME}" = "agmarknet/api-key" ]; then
            echo "::error::Refusing Secrets Manager write for unexpected name."
            exit 1
          fi
          if [ "${SAM_ENVIRONMENT}" = "prod" ] && [ "${NAME}" != "agmarknet/api-key-prod" ]; then
            echo "::error::Production may only manage agmarknet/api-key-prod."
            exit 1
          fi
          if [ "${SAM_ENVIRONMENT}" = "dev" ] && [ "${NAME}" != "agmarknet/api-key-dev" ]; then
            echo "::error::Development may only manage agmarknet/api-key-dev."
            exit 1
          fi
          if [ -z "${AGMARKNET_API_KEY}" ]; then
            echo "::error::AGMARKNET_API_KEY GitHub secret is empty. Stopping before AWS changes so the fetcher is not pointed at a missing env-specific secret."
            exit 1
          fi
          echo "Managing Secrets Manager secret name=${NAME} (value not logged)"
          if aws secretsmanager describe-secret --secret-id "$NAME" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "$NAME" --secret-string "$AGMARKNET_API_KEY"
            echo "Updated Secrets Manager secret $NAME"
          else
            aws secretsmanager create-secret --name "$NAME" --secret-string "$AGMARKNET_API_KEY"
            echo "Created Secrets Manager secret $NAME"
          fi

      - uses: aws-actions/setup-sam@v3

      - name: SAM Deploy
        working-directory: infrastructure
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZOR_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZOR_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          USPS_CLIENT_ID: ${{ secrets.USPS_CLIENT_ID }}
          USPS_CLIENT_SECRET: ${{ secrets.USPS_CLIENT_SECRET }}
          USPS_SECRET_ARN: ${{ secrets.USPS_SECRET_ARN }}
          USPS_BASE_URL: ${{ secrets.USPS_BASE_URL }}
          USPS_CRID: ${{ secrets.USPS_CRID }}
          USPS_MID: ${{ secrets.USPS_MID }}
          USPS_EPS_ACCOUNT_NUMBER: ${{ secrets.USPS_EPS_ACCOUNT_NUMBER }}
          USPS_PAYMENT_AUTHORIZATION_TOKEN: ${{ secrets.USPS_PAYMENT_AUTHORIZATION_TOKEN }}
          ORANGE_COUNTY_VENDOR_API_KEY: ${{ secrets.ORANGE_COUNTY_VENDOR_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          MARKETING_SMTP_PASS: ${{ secrets.MARKETING_SMTP_PASS }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          EPROLO_OPEN_API_KEY: ${{ secrets.EPROLO_OPEN_API_KEY }}
          EPROLO_OPEN_API_SECRET: ${{ secrets.EPROLO_OPEN_API_SECRET }}
        run: |
          # Omit empty WhatsApp/Twilio/marketing overrides so a prior SAM deploy's values are not wiped.
          BASE_URL="${USPS_BASE_URL:-https://apis.usps.com}"
          EXTRA=""
          [ -n "${WHATSAPP_TOKEN:-}" ] && EXTRA="$EXTRA WhatsAppToken=${WHATSAPP_TOKEN}"
          [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && EXTRA="$EXTRA WhatsAppPhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID}"
          [ -n "${WHATSAPP_TEMPLATE_NAME:-}" ] && EXTRA="$EXTRA WhatsAppTemplateName=${WHATSAPP_TEMPLATE_NAME}"
          [ -n "${WHATSAPP_TEMPLATE_LANG:-}" ] && EXTRA="$EXTRA WhatsAppTemplateLang=${WHATSAPP_TEMPLATE_LANG}"
          [ -n "${TWILIO_ACCOUNT_SID:-}" ] && EXTRA="$EXTRA TwilioAccountSid=${TWILIO_ACCOUNT_SID}"
          [ -n "${TWILIO_AUTH_TOKEN:-}" ] && EXTRA="$EXTRA TwilioAuthToken=${TWILIO_AUTH_TOKEN}"
          [ -n "${TWILIO_WHATSAPP_FROM:-}" ] && EXTRA="$EXTRA TwilioWhatsAppFrom=${TWILIO_WHATSAPP_FROM}"
          if [ -n "${SMTP_PASSWORD:-}" ]; then
            EXTRA="$EXTRA SmtpPassword=${SMTP_PASSWORD}"
          else
            echo "::warning::SMTP_PASSWORD secret is empty — keeping the previously deployed enquiry@spicycenter.com password so cart/order emails keep sending."
          fi
          if [ -n "${MARKETING_SMTP_PASS:-}" ]; then
            EXTRA="$EXTRA MarketingSmtpPassword=${MARKETING_SMTP_PASS}"
          else
            echo "::warning::MARKETING_SMTP_PASS secret is empty — marketing campaigns need Mailercloud credentials in Admin → Email → Settings (or set the GitHub secret)."
          fi
          [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && EXTRA="$EXTRA RazorpayWebhookSecret=${RAZORPAY_WEBHOOK_SECRET}"
          [ -n "${CJ_API_KEY:-}" ] && EXTRA="$EXTRA CjApiKey=${CJ_API_KEY}"
          [ -n "${EPROLO_OPEN_API_KEY:-}" ] && EXTRA="$EXTRA EproloOpenApiKey=${EPROLO_OPEN_API_KEY}"
          [ -n "${EPROLO_OPEN_API_SECRET:-}" ] && EXTRA="$EXTRA EproloOpenApiSecret=${EPROLO_OPEN_API_SECRET}"
          echo "SAM deploy region=${AWS_REGION} stack=${STACK_NAME} config-env=${CONFIG_ENV} Environment=${SAM_ENVIRONMENT}"
          sam build --cached --parallel --config-env "${CONFIG_ENV}" && sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-env "${CONFIG_ENV}" \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides "\
          Environment=${SAM_ENVIRONMENT} \
          EnableVendorApi=false \
          RazorpayKeyId=${RAZORPAY_KEY_ID} \
          RazorpayKeySecret=${RAZORPAY_KEY_SECRET} \
          StripeSecretKey=${STRIPE_SECRET_KEY} \
          StripeWebhookSecret=${STRIPE_WEBHOOK_SECRET} \
          UspsClientId=${USPS_CLIENT_ID} \
          UspsClientSecret=${USPS_CLIENT_SECRET} \
          UspsSecretArn=${USPS_SECRET_ARN} \
          UspsBaseUrl=${BASE_URL} \
          UspsCrid=${USPS_CRID} \
          UspsMid=${USPS_MID} \
          UspsEpsAccountNumber=${USPS_EPS_ACCOUNT_NUMBER} \
          UspsPaymentAuthorizationToken=${USPS_PAYMENT_AUTHORIZATION_TOKEN} \
          OrangeCountyVendorApiKey=${ORANGE_COUNTY_VENDOR_API_KEY}${EXTRA}"

      # Catalog import OVERWRITES product records and has wiped admin-uploaded images.
      # Run manually only: Actions → Import SpicyCorner Catalog (workflow_dispatch).

  deploy-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [deploy-api, resolve-target]
    if: |
      needs.resolve-target.outputs.should_deploy == 'true' &&
      (
        (needs.resolve-target.outputs.environment == 'prod' && github.ref_name == 'main') ||
        (needs.resolve-target.outputs.environment == 'dev' && github.ref_name == 'dev')
      )
    env:
      CONFIG_ENV: ${{ needs.resolve-target.outputs.config_env }}
      STACK_NAME: ${{ needs.resolve-target.outputs.stack_name }}
      SAM_ENVIRONMENT: ${{ needs.resolve-target.outputs.environment }}
    steps:
      - name: Guard stack output lookup
        run: |
          set -euo pipefail
          echo "Web build will read stack ${STACK_NAME} (Environment=${SAM_ENVIRONMENT})"
          if [ "${SAM_ENVIRONMENT}" = "prod" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ] || [ "${STACK_NAME}" != "spicycorner-prod" ]; then
              echo "::error::Production web build is allowed only from main against spicycorner-prod."
              exit 1
            fi
          elif [ "${SAM_ENVIRONMENT}" = "dev" ]; then
            if [ "${GITHUB_REF_NAME}" != "dev" ] || [ "${STACK_NAME}" != "spicycorner-dev" ]; then
              echo "::error::Development web build is allowed only from the dev branch against spicycorner-dev."
              exit 1
            fi
          else
            echo "::error::Unsupported SAM environment '${SAM_ENVIRONMENT}'."
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Require AWS_REGION from GitHub
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::Set AWS_REGION in GitHub → Settings → Secrets and variables → Actions (Variables or Secrets)."
            exit 1
          fi
          echo "AWS_REGION=${AWS_REGION}"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Export SAM outputs for web build
        run: |
          output() {
            aws cloudformation describe-stacks \
              --region "${AWS_REGION}" \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          echo "NEXT_PUBLIC_API_URL=$(output ApiUrl)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(output UserPoolId)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(output UserPoolClientId)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CDN_URL=https://$(output CloudFrontDomain)" >> "$GITHUB_ENV"
      - run: npm run build -w @spicycorner/shared
      - run: npm run build -w @spicycorner/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.RAZOR_KEY_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ env.AWS_REGION }}
          NEXT_PUBLIC_USD_INR_RATE: ${{ secrets.NEXT_PUBLIC_USD_INR_RATE }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA4_ID: ${{ secrets.NEXT_PUBLIC_GA4_ID }}
      # Storefront publishing is Amplify's GitHub connection (amplify.yml).
      # Do not start-job or poll Amplify from Actions — that duplicates the auto-build.
